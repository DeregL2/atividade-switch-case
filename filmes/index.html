<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estilo de Filme Favorito</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    #resultado { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Estilo de Filme Favorito</h1>
  <p>Opções disponíveis:</p>
  <ol>
    <li>Ação</li>
    <li>Comédia</li>
    <li>Drama</li>
    <li>Terror</li>
    <li>Ficção Científica</li>
    <li>Romance</li>
  </ol>

  <button onclick="escolherFilme()">Escolher estilo</button>
  <p id="resultado"></p>

  <script>
    function escolherFilme() {
      const opcao = prompt(
        "Digite o número do seu estilo de filme favorito:\n" +
        "1 - Ação\n2 - Comédia\n3 - Drama\n4 - Terror\n5 - Ficção Científica\n6 - Romance"
      );

      let estilo;

      switch (Number(opcao)) {
        case 1:
          estilo = "Ação";
          break;
        case 2:
          estilo = "Comédia";
          break;
        case 3:
          estilo = "Drama";
          break;
        case 4:
          estilo = "Terror";
          break;
        case 5:
          estilo = "Ficção Científica";
          break;
        case 6:
          estilo = "Romance";
          break;
        default:
          estilo = null;
      }

      const resultado = document.getElementById("resultado");

      if (estilo === null) {
        resultado.textContent = "Opção inválida. Escolha um número de 1 a 6.";
      } else {
        resultado.textContent = "Seu estilo de filme favorito é: " + estilo;
      }
    }
  </script>
</body>
</html>
