<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gênero Musical Preferido</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    #resultado { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Gênero Musical Preferido</h1>
  <p>Opções disponíveis:</p>
  <ol>
    <li>Rock</li>
    <li>Pop</li>
    <li>Hip Hop</li>
    <li>Eletrônica</li>
    <li>Jazz</li>
    <li>Clássica</li>
  </ol>

  <button onclick="escolherGenero()">Escolher gênero</button>
  <p id="resultado"></p>

  <script>
    function escolherGenero() {
      const opcao = prompt(
        "Digite o número do seu gênero musical preferido:\n" +
        "1 - Rock\n2 - Pop\n3 - Hip Hop\n4 - Eletrônica\n5 - Jazz\n6 - Clássica"
      );

      let genero;

      switch (Number(opcao)) {
        case 1:
          genero = "Rock";
          break;
        case 2:
          genero = "Pop";
          break;
        case 3:
          genero = "Hip Hop";
          break;
        case 4:
          genero = "Eletrônica";
          break;
        case 5:
          genero = "Jazz";
          break;
        case 6:
          genero = "Clássica";
          break;
        default:
          genero = null;
      }

      const resultado = document.getElementById("resultado");

      if (genero === null) {
        resultado.textContent = "Opção inválida. Escolha um número de 1 a 6.";
      } else {
        resultado.textContent = "Seu gênero musical preferido é: " + genero;
      }
    }
  </script>
</body>
</html>
